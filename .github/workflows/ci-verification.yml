name: CI Verification Contract

# ATM-001-SEC-CLOSURE-WP3-01 — required CI verification contract.
#
# WHY THIS WORKFLOW EXISTS
#
# The integration workflow (`db-integration.yml`) executes only the sanctioned
# PostgreSQL integration suites. It does NOT execute `npm test`, so the
# non-destructive unit suites were never run in CI; and it performed no
# dependency-security check at all. A suite that skips itself without the
# database-test gate therefore executed NOWHERE while CI still reported green.
#
# This workflow closes that hole with three independent, separately-named jobs,
# so a failure is attributable and can be required individually:
#
#   unit-tests        — `npm test`: the whole tests/*.test.js inventory.
#   test-inventory    — the coverage contract: no suite may be unaccounted for.
#   dependency-audit  — production-dependency advisories at high/critical.
#
# No repository secrets and no production credentials are referenced.
#
# NOTE: `dependency-audit` is EXPECTED TO FAIL until the known production
# advisories are remediated (ATM-001-SEC-CLOSURE-WP5). It is deliberately not
# suppressed: the failure is the signal. See docs/CI-VERIFICATION-CONTRACT.md.

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (npm test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Pinned to a full commit SHA. actions/checkout v4.4.0
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # Pinned to a full commit SHA. actions/setup-node v4.4.0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Runs the complete tests/*.test.js inventory. The database-mutating suites
      # skip themselves here (no TEST_DB_* gate), which is exactly why the
      # test-inventory job exists: a skipped suite must still be accounted for.
      - name: Run unit tests (npm test)
        run: npm test
      # Runtime execution evidence for the suites that `npm test` is expected to
      # execute. Static classification cannot prove that a test body ran; this
      # runs each suite and reads the runner's own JUnit report. A suite that
      # defines nothing, or whose only definitions are unreachable, is observed
      # to execute ZERO tests and fails here.
      - name: Verify runtime execution evidence (unit suites)
        run: node scripts/test-execution-evidence.js --mode unit

  # ATM-001-SEC-103 — INDEPENDENT EXECUTION ORACLE.
  #
  # WHY THIS JOB EXISTS
  #
  # `unit-tests` above runs the verifier (scripts/test-execution-evidence.js) and
  # trusts what it prints. Eight adversarial rounds showed why that cannot work:
  # the verifier was its own oracle, so an edit to the verifier alone could reduce
  # its selection to 1 of 13 suites, or print 13 identities while executing fewer,
  # with every other check still green.
  #
  # This job makes the verifier answer to something it does not control:
  #
  #   * the EXPECTED suite identities are derived by scripts/ci-execution-oracle.js
  #     from the filesystem (tests/*.test.js), from the integration registration
  #     ledger and from a hardcoded documented legacy list — never from analyse();
  #   * the EXPECTED commands are read verbatim from these workflow files;
  #   * what actually EXECUTED is observed through the oracle's own reporter,
  #     injected via NODE_OPTIONS, writing to an append-only journal in a per-run
  #     directory the verifier never writes to — not from the verifier's stdout,
  #     JSON record or JUnit documents;
  #   * the CI environment is reproduced (CI=true, GITHUB_ACTIONS=true, no database
  #     gate, no test-only markers), and the selection must be unchanged when every
  #     test-only env marker is set, which closes the marker-conditional escape.
  #
  # It deliberately re-runs `npm test` and the unit evidence command under
  # observation, so it is a second, independent execution of the same commands
  # rather than a review of their logs. Measured budget (Node 22.23.2, one
  # developer machine): ~13 minutes; the job limit is set well above that and the
  # oracle applies its own per-command timeout, so a hang fails visibly.
  #
  # No repository secrets and no production credentials are referenced. The
  # observation channel is inert in any process that is not the Node test runner.
  independent-execution-oracle:
    name: Independent execution oracle (unit)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Pinned to a full commit SHA. actions/checkout v4.4.0
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # Pinned to a full commit SHA. actions/setup-node v4.4.0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify CI command, environment and executed suite identities
        run: node scripts/ci-execution-oracle.js --scope unit

  test-inventory:
    name: Test inventory coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pinned to a full commit SHA. actions/checkout v4.4.0
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # Pinned to a full commit SHA. actions/setup-node v4.4.0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      # Fails when any suite is unaccounted for, when a registration is stale,
      # when the executed glob is narrowed, or when the contract cannot be parsed.
      - name: Assert test coverage
        run: node scripts/assert-test-coverage.js

  dependency-audit:
    name: Dependency security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pinned to a full commit SHA. actions/checkout v4.4.0
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # Pinned to a full commit SHA. actions/setup-node v4.4.0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Production dependencies only. High and critical advisories are blocking.
      # No suppressions and no severity downgrade: a known advisory must fail.
      - name: Audit production dependencies (high and critical are blocking)
        run: npm audit --omit=dev --audit-level=high
