name: PostgreSQL Integration Validation

# First active GitHub Actions workflow for Atiman.
#
# Provisions a disposable, job-scoped PostgreSQL, applies the complete schema
# through the CANONICAL migration runner (scripts/migrate-postgres.js, the same
# command production uses), asserts schema readiness, and runs the sanctioned
# integration runner (scripts/run-integration-tests.js). The workflow requires
# no repository secrets and references no production credential.
#
# Migrations discovered and applied: whatever database/postgresql/ currently
# contains. Nothing is hardcoded here.
#
# The ATM-013D.4 safety invariant is preserved: the sanctioned runner is the
# only execution path, and it establishes NODE_ENV=test / RUN_DB_TESTS=true
# itself. This workflow deliberately does NOT set those variables, which keeps
# ordinary `npm test` non-destructive here.

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: Disposable PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          # Throwaway literals for the job-scoped service container. They are
          # destroyed with the runner and are not secrets.
          POSTGRES_USER: atiman_test
          POSTGRES_PASSWORD: atiman_test_password
          POSTGRES_DB: atiman_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Single source of truth for the disposable test database. TEST_DB_NAME
      # satisfies the ATM-013D.4 test-database name rule enforced by
      # src/config/database.js and scripts/run-integration-tests.js.
      TEST_DB_HOST: localhost
      TEST_DB_PORT: "5432"
      TEST_DB_NAME: atiman_test
      TEST_DB_USER: atiman_test
      TEST_DB_PASSWORD: atiman_test_password

    steps:
      - name: Checkout repository
        # Pinned to a full commit SHA (actions/checkout v4.4.0) so a moved tag
        # cannot change what executes in this job.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js
        # Pinned to a full commit SHA (actions/setup-node v4.4.0).
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply PostgreSQL schema (canonical migration runner)
        shell: bash
        env:
          # The runner deliberately refuses to execute while TEST_DB_* is present,
          # so it is given explicit DB_* configuration and the test variables are
          # unset. This is exactly the command production uses, and no PostgreSQL
          # client tools are required.
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: atiman_test
          DB_USER: atiman_test
          DB_PASSWORD: atiman_test_password
        run: |
          set -euo pipefail

          unset TEST_DB_HOST TEST_DB_PORT TEST_DB_NAME TEST_DB_USER TEST_DB_PASSWORD

          npm run db:migrate:postgres

          # Read-only assertion that the schema is actually compatible with this
          # application, not merely present.
          node scripts/smoke-test-pg.js

          echo "Schema applied and readiness asserted successfully."

      - name: Run sanctioned database integration tests
        run: npm run test:integration
