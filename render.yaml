services:
  - type: web
    name: atiman-api
    env: node
    plan: starter
    region: singapore
    branch: main
    rootDir: .
    buildCommand: npm ci --omit=dev
    startCommand: node src/index.js
    healthCheckPath: /health
    # Deployment order: migrate -> assert schema readiness -> start the app.
    # A non-zero exit from either command fails the deploy closed, so the
    # application never starts against a schema it cannot use.
    preDeployCommand: npm run db:migrate:postgres && node scripts/smoke-test-pg.js
    # Auto-Deploy is intentionally ENABLED: an approved merge to main is the
    # production deployment authorization event, and migrations included in that
    # release are authorized by the same approved merge. Review PRs for
    # production readiness BEFORE merge. Manual deploys remain available
    # operationally but are not the normal authorization path.
    # See DEPLOYMENT_CLOUD.md.
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: DB_CONNECTION_LIMIT
        value: "10"
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL
        value: "true"
      - key: DB_SSL_REJECT_UNAUTHORIZED
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: REQUEST_BODY_LIMIT
        value: 1mb
      - key: UPLOAD_MAX_SIZE
        value: "10485760"
      - key: ASSET_IMPORT_MAX_ROWS
        value: "10000"
      - key: LOG_LEVEL
        value: info
